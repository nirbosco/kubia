<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מאגר השאלות · עבר · הווה · עתיד</title>
<meta name="theme-color" content="#0046ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0046ff;--light:#0fb4f5;--ink:#0a1330;--bg:#f0f0f0;--card:#fff;--line:#dcdce4;--muted:#67677a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Rubik",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}

.shell{display:grid;grid-template-columns:220px 1fr;min-height:100dvh}
aside{background:#fff;border-left:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;color:var(--blue)}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
aside nav{display:flex;flex-direction:column;gap:4px}
aside nav a{color:var(--ink);text-decoration:none;font-size:14.5px;padding:9px 11px;border-radius:9px}
aside nav a:hover{background:#f4f4f8}
aside nav a.on{background:#eef2ff;color:var(--blue);font-weight:600}
.stat{border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .n{font-size:26px;font-weight:800;color:var(--blue);line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:3px}

main{padding:26px 30px 60px;min-width:0}
h1{font-size:23px;margin:0 0 4px;font-weight:800}
.lead{color:var(--muted);font-size:14.5px;margin:0 0 22px}

.panel{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:22px;overflow:hidden}
.panel > h2{font-size:15px;margin:0;padding:15px 18px;border-bottom:1px solid var(--line);font-weight:600}
.panel .body{padding:16px 18px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select{font-family:inherit;font-size:14.5px;padding:10px 13px;border:1px solid var(--line);
  border-radius:9px;background:#fff;color:var(--ink);min-width:0}
input[type=text]{flex:1;min-width:220px}
input:focus,select:focus{outline:none;border-color:var(--blue)}
button.b{font-family:inherit;font-size:14.5px;font-weight:600;padding:10px 20px;border-radius:999px;
  border:1.5px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;white-space:nowrap}
button.b.ghost{background:#fff;color:var(--blue)}
button.b:disabled{opacity:.5;cursor:default}
button.mini{font-family:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--muted);cursor:pointer}
button.mini:hover{border-color:var(--blue);color:var(--blue)}

table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:right;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 18px;border-bottom:1px solid #f0f0f4;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.hidden-q td{opacity:.45}
.tag{display:inline-block;font-size:12px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.c{border-color:#c9d4ff;color:var(--blue);background:#f5f7ff}
.tbl-wrap{overflow-x:auto}
.qcell{min-width:240px}
.qcell input{width:100%;font-family:inherit;font-size:14.5px;border:1px solid transparent;background:none;padding:6px 8px;border-radius:7px;color:var(--ink)}
.qcell input:focus{border-color:var(--blue);background:#fff;outline:none}
#msg{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:50}
#msg.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:26px 18px;color:var(--muted);font-size:14.5px;text-align:center}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  aside{flex-direction:row;align-items:center;justify-content:space-between;border-left:none;border-bottom:1px solid var(--line);padding:14px 16px;gap:12px;flex-wrap:wrap}
  aside nav{flex-direction:row;gap:2px}
  .stat{display:none}
  main{padding:18px 16px 50px}
}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><span class="dot"></span>עבר · הווה · עתיד</div>
    <nav>
      <a class="on" href="#">מאגר השאלות</a>
      <a href="index.html">למשחק</a>
      <a href="עבר-הווה-עתיד-להדפסה.pdf" download>חבילה להדפסה</a>
    </nav>
    <div class="stat"><div class="n" id="stat-n">—</div><div class="l">שאלות מוצגות במאגר</div></div>
  </aside>

  <main>
    <h1>מאגר השאלות</h1>
    <p class="lead">המאגר משותף לכל מי שמשחק. שאלה שמוסיפים כאן מופיעה במשחק הבא.</p>

    <div class="panel">
      <h2>שאלה חדשה</h2>
      <div class="body">
        <div class="row">
          <input type="text" id="new-text" placeholder="למשל: הרגע שהבנתי שאני במקום הנכון" maxlength="200">
          <select id="new-cat">
            <option value="1">1 · עבר אישי</option>
            <option value="2">2 · עבר מקצועי</option>
            <option value="3">3 · עתיד מקצועי</option>
            <option value="4">4 · עתיד אישי</option>
            <option value="5" selected>5 · הווה אישי</option>
            <option value="6">6 · הווה מקצועי</option>
          </select>
          <select id="new-aud">
            <option value="general" selected>לכולם</option>
            <option value="teachers">מורים ואנשי שטח</option>
            <option value="leaders">מובילי תוכניות</option>
          </select>
          <button class="b" id="btn-add">הוספה למאגר</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>משחק חדש</h2>
      <div class="body">
        <div class="row">
          <select id="g-aud">
            <option value="teachers" selected>מורים ואנשי שטח</option>
            <option value="leaders">מובילי ומנהלי תוכניות</option>
          </select>
          <select id="g-dice">
            <option value="virtual" selected>קובייה בטלפון</option>
            <option value="physical">קובייה אמיתית בחדר</option>
          </select>
          <select id="g-rep">
            <option value="0" selected>קלף שיצא נעלם</option>
            <option value="1">קלף שיצא יכול לחזור</option>
          </select>
          <button class="b ghost" id="btn-game">פתיחת משחק</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>כל השאלות</h2>
      <div class="body">
        <div class="row">
          <input type="text" id="q-search" placeholder="חיפוש בטקסט">
          <select id="f-cat">
            <option value="">כל הקטגוריות</option>
            <option value="1">1 · עבר אישי</option><option value="2">2 · עבר מקצועי</option>
            <option value="3">3 · עתיד מקצועי</option><option value="4">4 · עתיד אישי</option>
            <option value="5">5 · הווה אישי</option><option value="6">6 · הווה מקצועי</option>
          </select>
          <select id="f-aud">
            <option value="">כל הקהלים</option>
            <option value="general">לכולם</option>
            <option value="teachers">מורים ואנשי שטח</option>
            <option value="leaders">מובילי תוכניות</option>
          </select>
          <select id="f-vis">
            <option value="">מוצגות ומוסתרות</option>
            <option value="1" selected>מוצגות בלבד</option>
            <option value="0">מוסתרות בלבד</option>
          </select>
        </div>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>השאלה</th><th>קטגוריה</th><th>קהל</th><th>מצב</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" style="display:none">אין שאלות שתואמות לסינון</div>
    </div>
  </main>
</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";
const SB_URL="https://ndrhiikczkbosentclnh.supabase.co";
const SB_KEY="sb_publishable_EckoZz1eIoRjjjQ9XhXhzA_EpuKVWQG";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const CATS={1:"עבר אישי",2:"עבר מקצועי",3:"עתיד מקצועי",4:"עתיד אישי",5:"הווה אישי",6:"הווה מקצועי"};
const AUDS={general:"לכולם",teachers:"מורים ואנשי שטח",leaders:"מובילי תוכניות"};
const $=s=>document.querySelector(s);
let all=[];
let msgT;
function msg(t){const m=$("#msg");m.textContent=t;m.classList.add("on");clearTimeout(msgT);msgT=setTimeout(()=>m.classList.remove("on"),3000);}

async function load(){
  const {data,error}=await sb.from("kubia_questions").select("*").order("category").order("created_at");
  if(error){ msg("לא הצלחנו לטעון את המאגר"); return; }
  all=data; render();
}
function render(){
  const q=$("#q-search").value.trim();
  const fc=$("#f-cat").value, fa=$("#f-aud").value, fv=$("#f-vis").value;
  const rows=all.filter(r=>
    (!q || r.text.includes(q)) &&
    (!fc || String(r.category)===fc) &&
    (!fa || r.audience===fa) &&
    (fv===""||String(r.visible?1:0)===fv));
  $("#stat-n").textContent=all.filter(r=>r.visible).length;
  $("#empty").style.display=rows.length?"none":"block";
  $("#tbody").innerHTML=rows.map(r=>`
    <tr class="${r.visible?"":"hidden-q"}" data-id="${r.id}">
      <td class="qcell"><input value="${r.text.replace(/"/g,"&quot;")}" data-orig="${r.text.replace(/"/g,"&quot;")}"></td>
      <td><span class="tag c">${r.category} · ${CATS[r.category]}</span></td>
      <td><span class="tag">${AUDS[r.audience]}</span></td>
      <td><button class="mini">${r.visible?"הסתרה":"הצגה"}</button></td>
    </tr>`).join("");

  $("#tbody").querySelectorAll("tr").forEach(tr=>{
    const id=tr.dataset.id;
    const row=all.find(x=>x.id===id);
    const inp=tr.querySelector("input");
    inp.addEventListener("blur",async()=>{
      const v=inp.value.trim();
      if(v===row.text) return;
      if(v.length<3){ inp.value=row.text; msg("שאלה קצרה מדי"); return; }
      try{
        await sb.rpc("kubia_edit_question",{p_id:id,p_text:v,p_category:row.category,p_audience:row.audience});
        row.text=v; msg("השאלה עודכנה");
      }catch(e){ inp.value=row.text; msg("העדכון לא נשמר"); }
    });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") inp.blur(); });
    tr.querySelector("button.mini").addEventListener("click",async()=>{
      try{
        await sb.rpc("kubia_set_visible",{p_id:id,p_visible:!row.visible});
        row.visible=!row.visible; render(); msg(row.visible?"השאלה חזרה למשחק":"השאלה הוסתרה");
      }catch(e){ msg("לא הצלחנו לשנות מצב"); }
    });
  });
}

$("#btn-add").addEventListener("click",async()=>{
  const text=$("#new-text").value.trim();
  if(text.length<3){ msg("צריך לכתוב שאלה"); return; }
  $("#btn-add").disabled=true;
  try{
    const {data,error}=await sb.rpc("kubia_add_question",
      {p_text:text,p_category:Number($("#new-cat").value),p_audience:$("#new-aud").value});
    if(error) throw error;
    $("#new-text").value=""; msg("נוספה למאגר"); await load();
  }catch(e){ msg("ההוספה לא נשמרה"); }
  finally{ $("#btn-add").disabled=false; }
});

$("#btn-game").addEventListener("click",async()=>{
  $("#btn-game").disabled=true;
  try{
    const {data,error}=await sb.rpc("kubia_create_room",
      {p_audience:$("#g-aud").value, p_dice_mode:$("#g-dice").value, p_allow_repeat:$("#g-rep").value==="1"});
    if(error) throw error;
    location.href="index.html?r="+data;
  }catch(e){ msg("לא הצלחנו לפתוח משחק"); $("#btn-game").disabled=false; }
});

["q-search","f-cat","f-aud","f-vis"].forEach(id=>{
  $("#"+id).addEventListener("input",render);
  $("#"+id).addEventListener("change",render);
});
$("#new-text").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#btn-add").click(); });
load();
</script>
</body>
</html>
