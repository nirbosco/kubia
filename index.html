<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>עבר · הווה · עתיד — מוקאפ עיצוב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0046ff; --light:#0fb4f5; --turq:#23d7cd; --advot:#2882f0;
  --deep:#3c5af0; --purple:#6437eb; --ink:#0a1330; --bg:#f0f0f0; --card:#ffffff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{
  font-family:"Rubik",sans-serif; background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column; min-height:100dvh; overflow-x:hidden;
}

/* ===== מעטפת ===== */
header.top{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; gap:10px;
}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; color:var(--blue)}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}
.roomchip{
  border:1.5px solid var(--blue); color:var(--blue); border-radius:999px;
  padding:6px 14px; font-weight:600; font-size:14px; background:#fff;
}
main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 16px 24px; width:100%; max-width:520px; margin:0 auto}

/* ===== ניווט מוקאפ (לא חלק מהמוצר) ===== */
nav.demo{
  display:flex; gap:6px; justify-content:center; padding:10px; background:#fff;
  border-top:1px solid #dcdce4; position:sticky; bottom:0; width:100%;
}
nav.demo button{
  font-family:inherit; font-size:13px; font-weight:500; border-radius:999px;
  border:1.5px solid #c6c6d2; background:#fff; color:#555; padding:8px 14px; cursor:pointer;
}
nav.demo button.on{border-color:var(--blue); color:var(--blue); font-weight:600}
.demo-note{font-size:11px;color:#8a8a97;text-align:center;padding:4px 0 8px;background:#fff;width:100%}

/* ===== כפתורים ===== */
.pill{
  font-family:inherit; cursor:pointer; border-radius:999px; font-weight:600;
  padding:16px 30px; font-size:18px; border:2px solid var(--blue);
  background:var(--blue); color:#fff; transition:transform .12s;
}
.pill:active{transform:scale(.96)}
.pill.ghost{background:#fff; color:var(--blue)}
.pill.small{padding:11px 20px; font-size:15px}

.screen{display:none; width:100%; flex-direction:column; align-items:center; gap:22px}
.screen.on{display:flex}
h1.title{font-size:26px; font-weight:800; margin:0; text-align:center}
p.sub{margin:0; color:#5a5a68; font-size:15px; text-align:center}

/* ===== מסך 1: שולחן וקובייה ===== */
.table-pad{
  width:min(78vw,300px); aspect-ratio:1; border-radius:28px;
  background:radial-gradient(circle at 50% 42%, #ffffff 0%, #e4e7f2 70%, #d6dae9 100%);
  border:1.5px solid #d0d4e4;
  display:flex; align-items:center; justify-content:center; perspective:900px;
}
.die{
  width:96px; height:96px; position:relative; transform-style:preserve-3d;
  transform:rotateX(-24deg) rotateY(32deg);
  transition:transform 1.25s cubic-bezier(.2,.75,.25,1);
}
.face{
  position:absolute; inset:0; background:var(--blue); border-radius:18px;
  border:3px solid #fff; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:12px;
  box-shadow:inset 0 0 22px rgba(0,0,0,.25);
}
.pip{width:14px;height:14px;border-radius:50%;background:#fff;place-self:center;opacity:0}
.f1 .p5{opacity:1}
.f2 .p1,.f2 .p9{opacity:1}
.f3 .p1,.f3 .p5,.f3 .p9{opacity:1}
.f4 .p1,.f4 .p3,.f4 .p7,.f4 .p9{opacity:1}
.f5 .p1,.f5 .p3,.f5 .p5,.f5 .p7,.f5 .p9{opacity:1}
.f6 .p1,.f6 .p3,.f6 .p4,.f6 .p6,.f6 .p7,.f6 .p9{opacity:1}
.face.front {transform:translateZ(48px)}
.face.back  {transform:rotateY(180deg) translateZ(48px)}
.face.right {transform:rotateY(90deg) translateZ(48px)}
.face.left  {transform:rotateY(-90deg) translateZ(48px)}
.face.top   {transform:rotateX(90deg) translateZ(48px)}
.face.bottom{transform:rotateX(-90deg) translateZ(48px)}
.roll-result{min-height:30px; font-size:19px; font-weight:600; color:var(--blue); text-align:center}
.physical{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:min(78vw,300px)}
.physical button{
  aspect-ratio:1; border-radius:18px; border:2px solid var(--blue); background:#fff;
  color:var(--blue); font-family:inherit; font-size:30px; font-weight:800; cursor:pointer;
}
.mode-switch{font-size:13px; color:#5a5a68; text-decoration:underline; background:none; border:none; font-family:inherit; cursor:pointer}

/* ===== מסך 2: מניפת קלפים ===== */
.fan-zone{position:relative; width:100%; height:340px}
.playcard{
  position:absolute; width:150px; height:214px; border-radius:16px;
  right:50%; top:24px; transform-origin:50% 118%;
  border:3px solid #fff; box-shadow:0 8px 22px rgba(10,19,48,.22);
  cursor:pointer; transition:transform .5s cubic-bezier(.3,.8,.3,1), opacity .4s;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  color:#fff; font-weight:800; overflow:hidden;
}
.playcard .mini-die{
  width:34px;height:34px;border-radius:9px;background:var(--light);
  border:2px solid #fff; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:4px;
}
.playcard .mini-die .pip{width:5px;height:5px}
.playcard .catname{font-size:17px; text-align:center; line-height:1.3; text-shadow:0 1px 6px rgba(0,0,0,.3)}
.cat-back-1,.cat-back-2{background:radial-gradient(circle at 50% 45%, #14328f 0%, var(--ink) 75%)}
.cat-back-3,.cat-back-4{background:radial-gradient(circle at 50% 45%, #8f6bff 0%, var(--purple) 70%)}
.cat-back-5,.cat-back-6{background:linear-gradient(180deg,#cdeefc 0%, #8fd4f4 55%, #ffe9b8 100%)}
.cat-back-5 .catname,.cat-back-6 .catname{color:#0b4ea3; text-shadow:none}
.rays{position:absolute; inset:-40%; background:repeating-conic-gradient(rgba(255,255,255,.14) 0 2deg, transparent 2deg 9deg); pointer-events:none}
.cat-back-5 .rays,.cat-back-6 .rays{display:none}

/* ===== מסך 3: קלף פתוח ===== */
.flip-wrap{width:min(80vw,320px); height:440px; perspective:1200px}
.flip-inner{width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.3,.7,.3,1)}
.flip-inner.revealed{transform:rotateY(180deg)}
.flip-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:22px;
  border:4px solid #fff; box-shadow:0 14px 34px rgba(10,19,48,.24);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:26px; overflow:hidden;
}
.flip-front{transform:rotateY(180deg); color:#fff; text-align:center}
.flip-front .qcat{
  border:1.5px solid rgba(255,255,255,.85); border-radius:999px; padding:5px 16px;
  font-size:13px; font-weight:500; background:rgba(255,255,255,.14)
}
.flip-front .qtext{font-size:31px; font-weight:800; line-height:1.35; text-wrap:balance}
.qf-1{background:var(--blue)} .qf-2{background:var(--deep)}
.qf-3,.qf-4{background:var(--purple)}
.qf-5{background:var(--advot)} .qf-6{background:var(--light)}
.actions{display:flex; flex-direction:column; gap:10px; width:min(80vw,320px)}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="dot"></span>עבר · הווה · עתיד</div>
  <div class="roomchip">חדר 4271 · 6 מחוברים</div>
</header>

<main>

  <!-- מסך 1: שולחן -->
  <section class="screen on" id="s-table">
    <h1 class="title">תור חדש</h1>
    <p class="sub" id="table-sub">מי שבתורו מטיל, וכולם רואים יחד</p>
    <div class="table-pad" id="virtual-pad">
      <div class="die" id="die">
        <div class="face front  f1"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
        <div class="face back   f6"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
        <div class="face right  f3"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
        <div class="face left   f4"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
        <div class="face top    f2"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
        <div class="face bottom f5"><span class="pip p1"></span><span class="pip p2"></span><span class="pip p3"></span><span class="pip p4"></span><span class="pip p5"></span><span class="pip p6"></span><span class="pip p7"></span><span class="pip p8"></span><span class="pip p9"></span></div>
      </div>
    </div>
    <div class="physical" id="physical-pad" style="display:none">
      <button onclick="pickFace(1)">1</button><button onclick="pickFace(2)">2</button><button onclick="pickFace(3)">3</button>
      <button onclick="pickFace(4)">4</button><button onclick="pickFace(5)">5</button><button onclick="pickFace(6)">6</button>
    </div>
    <div class="roll-result" id="roll-result"></div>
    <button class="pill" id="roll-btn" onclick="roll()">הטילו את הקובייה</button>
    <button class="mode-switch" onclick="toggleMode()" id="mode-btn">יש לכם קובייה אמיתית בחדר? עברו למצב קובייה פיזית</button>
  </section>

  <!-- מסך 2: מניפה -->
  <section class="screen" id="s-fan">
    <h1 class="title" id="fan-title">הווה אישי</h1>
    <p class="sub">בחרו קלף מהחבילה</p>
    <div class="fan-zone" id="fan-zone"></div>
  </section>

  <!-- מסך 3: קלף פתוח -->
  <section class="screen" id="s-card">
    <div class="flip-wrap">
      <div class="flip-inner" id="flip-inner">
        <div class="flip-face playcard-back" id="flip-back"></div>
        <div class="flip-face flip-front" id="flip-front">
          <span class="qcat" id="qcat">הווה אישי</span>
          <div class="qtext" id="qtext">הזמן האהוב עליי ביום</div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="pill" onclick="go('s-table')">עניתי, ממשיכים</button>
      <button class="pill ghost small" onclick="openFan(state.cat)">קלף אחר</button>
      <button class="pill ghost small" onclick="go('s-table')">הטלה מחדש</button>
    </div>
  </section>

</main>

<nav class="demo">
  <button class="on" onclick="demoNav('s-table',this)">שולחן</button>
  <button onclick="demoNav('s-fan',this); openFan(5,true)">חבילה</button>
  <button onclick="demoNav('s-card',this); showCard(5,'הזמן האהוב עליי ביום',true)">קלף פתוח</button>
</nav>
<div class="demo-note">סרגל תחתון זה קיים רק במוקאפ, לדפדוף בין המסכים</div>

<script>
"use strict";
const CATS = {1:"עבר אישי",2:"עבר מקצועי",3:"עתיד מקצועי",4:"עתיד אישי",5:"הווה אישי",6:"הווה מקצועי"};
const SAMPLE = {
  1:["העבודה הכי מהנה שעשיתי","תחביב שזנחתי","ההחלטה הכי טובה שקיבלתי"],
  2:["כיתה שאזכור לנצח","מנטור מקצועי שאימצתי","התלמידים שלי יגידו עליי ש..."],
  3:["עוד 10 שנים אני רוצה להיות","אם אעשה הסבה זה יהיה ל..."],
  4:["מקום שאני חייב.ת לבקר בו בעולם","משהו שארצה ללמוד / לחקור"],
  5:["הזמן האהוב עליי ביום","תחביב מפתיע שיש לי","הרגלי שתיית הקפה שלי","חדשות או נטפליקס"],
  6:["למה אני פה?","החלק האהוב עליי בתפקיד","הצוות שלי יגיד עליי ש..."]
};
/* סיבוב שמביא כל פאה לחזית */
const ORIENT = {1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]};
const state = {cat:5, physical:false, rolling:false, spinX:-24, spinY:32};
const $ = s => document.querySelector(s);
const PIPS = {1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function miniDie(cat){
  const cells = Array.from({length:9},(_,i)=>`<span class="pip" style="opacity:${PIPS[cat].includes(i+1)?1:0}"></span>`).join("");
  return `<div class="mini-die">${cells}</div>`;
}

function go(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));
  $("#"+id).classList.add("on");
}
function demoNav(id, btn){
  document.querySelectorAll("nav.demo button").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  if(id==="s-table"){ go(id); }
}
function toggleMode(){
  state.physical = !state.physical;
  $("#virtual-pad").style.display = state.physical ? "none" : "flex";
  $("#roll-btn").style.display   = state.physical ? "none" : "inline-block";
  $("#physical-pad").style.display = state.physical ? "grid" : "none";
  $("#mode-btn").textContent = state.physical ? "חזרה לקובייה וירטואלית" : "יש לכם קובייה אמיתית בחדר? עברו למצב קובייה פיזית";
  $("#table-sub").textContent = state.physical ? "הטילו את הקובייה בחדר והקישו על מה שיצא" : "מי שבתורו מטיל, וכולם רואים יחד";
}
function roll(){
  if(state.rolling) return;
  state.rolling = true;
  $("#roll-result").textContent = "";
  const face = 1 + Math.floor(Math.random()*6);
  const [ox, oy] = ORIENT[face];
  state.spinX += 360*2; state.spinY += 360*2;
  const die = $("#die");
  die.style.transform = `rotateX(${state.spinX + ox}deg) rotateY(${state.spinY + oy}deg)`;
  setTimeout(()=>{
    $("#roll-result").textContent = face + " · " + CATS[face];
    setTimeout(()=>{ state.rolling=false; openFan(face); }, 750);
  }, 1300);
}
function pickFace(face){
  $("#roll-result").textContent = face + " · " + CATS[face];
  setTimeout(()=>openFan(face), 550);
}
function openFan(cat, noNav){
  state.cat = cat;
  $("#fan-title").textContent = CATS[cat];
  const zone = $("#fan-zone");
  zone.innerHTML = "";
  const n = 7;
  for(let i=0;i<n;i++){
    const c = document.createElement("div");
    c.className = "playcard cat-back-"+cat;
    const ang = -27 + i*(54/(n-1));
    c.style.transform = `translateX(50%) rotate(${ang}deg)`;
    c.innerHTML = `<div class="rays"></div>${miniDie(cat)}<div class="catname">${CATS[cat].replace(" ","<br>")}</div>`;
    c.onclick = () => {
      c.style.transform = `translateX(50%) rotate(0deg) translateY(-46px) scale(1.06)`;
      const qs = SAMPLE[cat];
      const q = qs[Math.floor(Math.random()*qs.length)];
      setTimeout(()=>showCard(cat, q), 420);
    };
    zone.appendChild(c);
  }
  go("s-fan");
}
function showCard(cat, q, instant){
  const inner = $("#flip-inner");
  inner.classList.remove("revealed");
  const back = $("#flip-back");
  back.className = "flip-face playcard cat-back-"+cat;
  back.style.position = "absolute";
  back.innerHTML = `<div class="rays"></div>${miniDie(cat)}<div class="catname">${CATS[cat].replace(" ","<br>")}</div>`;
  $("#flip-front").className = "flip-face flip-front qf-"+cat;
  $("#qcat").textContent = CATS[cat];
  $("#qtext").textContent = q;
  go("s-card");
  setTimeout(()=>inner.classList.add("revealed"), instant ? 60 : 350);
}
</script>
</body>
</html>
